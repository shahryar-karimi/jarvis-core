[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "Cloud brain and orchestration service for JARVIS"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19,<2.0",
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1.0",
  "httpx>=0.28,<1.0",
  "httpx2>=2.0,<3.0",
  "PyYAML>=6.0,<7.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.15,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires the configured PostgreSQL database",
  "live: calls a real external AI provider and may consume quota",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "UP040", # PEP 695 `type` statements do not preserve Pydantic Annotated metadata the way this codebase needs.
  "B027",  # AIProvider.aclose is an intentionally optional override hook, not an abstract method.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
