name: jarvis-core-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-core-runtime: &core-runtime
  image: jarvis-core:${JARVIS_IMAGE_TAG:?JARVIS_IMAGE_TAG is required}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_VERSION: ${JARVIS_IMAGE_TAG:?JARVIS_IMAGE_TAG is required}
      VCS_REF: ${JARVIS_VCS_REF:?JARVIS_VCS_REF is required}
  env_file:
    - ${JARVIS_ENV_FILE:-.env.production}
  environment:
    # Core only needs the non-superuser URL. Do not expose bootstrap database
    # credentials (or the separately named app-role values) in this container.
    POSTGRES_ADMIN_USER: ""
    POSTGRES_ADMIN_PASSWORD: ""
    POSTGRES_USER: ""
    POSTGRES_PASSWORD: ""
    POSTGRES_DB: ""
    JARVIS_DB_USER: ""
    JARVIS_DB_PASSWORD: ""
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - database
  depends_on:
    postgres:
      condition: service_healthy
  logging: *default-logging

services:
  postgres:
    image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    restart: unless-stopped
    init: true
    entrypoint:
      - /bin/sh
      - /opt/jarvis/postgres-entrypoint-wrapper.sh
    command:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      JARVIS_DB_USER: ${JARVIS_DB_USER:?JARVIS_DB_USER is required}
      JARVIS_DB_PASSWORD: ${JARVIS_DB_PASSWORD:?JARVIS_DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-bootstrap-jarvis-role.sh:/docker-entrypoint-initdb.d/10-bootstrap-jarvis-role.sh:ro
      - ./deploy/postgres/postgres-entrypoint-wrapper.sh:/opt/jarvis/postgres-entrypoint-wrapper.sh:ro
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    shm_size: 256mb
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  db-bootstrap:
    image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
    profiles:
      - tools
    restart: "no"
    init: true
    entrypoint:
      - /bin/sh
      - /opt/jarvis/10-bootstrap-jarvis-role.sh
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      JARVIS_DB_USER: ${JARVIS_DB_USER:?JARVIS_DB_USER is required}
      JARVIS_DB_PASSWORD: ${JARVIS_DB_PASSWORD:?JARVIS_DB_PASSWORD is required}
      JARVIS_DB_BOOTSTRAP_HOST: postgres
    volumes:
      - ./deploy/postgres/10-bootstrap-jarvis-role.sh:/opt/jarvis/10-bootstrap-jarvis-role.sh:ro
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev,noexec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: *default-logging

  migrate:
    <<: *core-runtime
    profiles:
      - tools
    restart: "no"
    command:
      - python
      - -m
      - alembic
      - upgrade
      - head
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  core:
    <<: *core-runtime
    restart: unless-stopped
    deploy:
      replicas: 1
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --ws-max-size
      - "${JARVIS_DEVICE_MAX_MESSAGE_BYTES:-65536}"
      - --no-server-header
    expose:
      - "8000"
    networks:
      - edge
      - database
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    init: true
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:?JARVIS_DOMAIN is required}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev,noexec
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

networks:
  edge:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
